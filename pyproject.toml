[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conformalforge"
version = "0.1.0"
description = "ConformalForge · 世界级分布无关不确定性量化系统（作者：晨星）"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["conformalforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF002", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
